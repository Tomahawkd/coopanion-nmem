name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm 11.28.6) from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unit tests (offline; contract suite skips without NMEM_CONTRACT_BASE_URL)
        run: pnpm test

      - name: Coverage (v8; statement/branch reports as delivery evidence)
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  publish:
    needs: gate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Release tag must match package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ${PKG_VERSION} does not match release tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      # npm policy: CI stages the package; the final publish requires
      # proof-of-presence (2FA) and is approved by the maintainer with:
      #   npm stage list
      #   npm stage approve <stage-id>
      - name: Stage publish (awaits maintainer approval)
        id: stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage publish ./ | tee stage-output.txt
          {
            echo "## Staged for publishing (awaiting approval)"
            echo
            echo '```'
            cat stage-output.txt
            echo '```'
            echo
            echo "Approve locally with: \`npm stage approve <stage-id>\` (requires 2FA)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List staged versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage list
